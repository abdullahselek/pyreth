[project]
name = "pyreth"
version = "0.1.0"
description = "High throughput, low latency parallel processing AI model inference engine."
authors = [{ name = "Abdullah Selek", email = "abdullahselek.os@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
keywords = [
  "inference sdk",
  "inference engine",
  "inference framework",
  "onnxruntime",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.5.4",
]

[project.urls]
Homepage = "https://github.com/abdullahselek/pyreth"
Repository = "https://github.com/abdullahselek/pyreth"
Issues = "https://github.com/abdullahselek/pyreth/issues"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]
benchmarks = [
    "huggingface-hub>=1.0.0",
    "onnx>=1.17.0",
    "onnxscript>=0.2.0",
    "torch>=2.6.0",
    "transformers>=4.48.0",
]

[build-system]
requires = ["scikit-build-core>=0.9.0", "nanobind>=2.4.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.25"
ninja.version = ">=1.10"
wheel.packages = ["python/pyreth"]
cmake.define = { BUILD_TESTING = "OFF", BUILD_BENCHMARKS = "OFF" }

[tool.cibuildwheel]
build = ["cp313-*", "cp314-*"]
skip = ["*-musllinux*", "*-win32", "*-manylinux_i686"]
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/tests/python"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair --exclude libonnxruntime* -w {dest_dir} {wheel} || cp {wheel} {dest_dir}"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "26.0" }
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
