name: CI

# Cancel a superseded run on the same branch/PR so we don't waste runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the "Actions" tab.
  workflow_dispatch:

jobs:
  standards:
    name: Formatting & Linting Standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check C++ code formatting (clang-format)
        run: |
          clang-format --version
          find include src unittest sandbox python \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check Python formatting & linting (ruff)
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: Build & test (${{ matrix.os }})
    needs: [standards]
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep going if one OS fails, so we get signal from all three in one run.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # CMAKE_BUILD_TYPE is honored by single-config generators (Makefiles/Ninja
      # on Linux & macOS) and safely ignored by the multi-config VS generator.
      # Note: first configure downloads GoogleTest via FetchContent (needs network).
      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      # Windows uses the multi-config Visual Studio generator -> build a specific
      # configuration. Linux/macOS are single-config and use CMAKE_BUILD_TYPE above.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Python tests (uv run pytest)
        run: |
          uv sync
          uv run pytest
