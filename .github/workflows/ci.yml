name: CI

# Cancel a superseded run on the same branch/PR so we don't waste runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the "Actions" tab.
  workflow_dispatch:

jobs:
  standards:
    name: Formatting & Linting Standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-dev

      - name: Check C++ code formatting (clang-format)
        run: |
          clang-format --version
          find include src unittest sandbox python benchmarks \( -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Check C++ static analysis (clang-tidy)
        run: |
          clang-tidy --version
          cmake -B build-tidy -S . -DBUILD_TESTING=OFF -DBUILD_BENCHMARKS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          clang-tidy -p build-tidy src/core/*.cpp

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Check Python formatting & linting (ruff)
        run: |
          uv sync --python 3.14
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: Build & test (${{ matrix.os }})
    needs: [standards]
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep going if one OS fails, so we get signal from all three in one run.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-dev

      # CMAKE_BUILD_TYPE is honored by single-config generators (Makefiles/Ninja
      # on Linux & macOS) and safely ignored by the multi-config VS generator.
      # Note: first configure downloads GoogleTest via FetchContent (needs network).
      - name: Configure
        shell: bash
        run: |
          if ! cmake -B build -S . -DCMAKE_BUILD_TYPE=Release; then
            echo "### CMake Configure Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if [ -f build/CMakeFiles/CMakeError.log ]; then
              cat build/CMakeFiles/CMakeError.log >> $GITHUB_STEP_SUMMARY
            fi
            if [ -f build/CMakeFiles/CMakeConfigureLog.yaml ]; then
              tail -n 120 build/CMakeFiles/CMakeConfigureLog.yaml >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # Windows uses the multi-config Visual Studio generator -> build a specific
      # configuration. Linux/macOS are single-config and use CMAKE_BUILD_TYPE above.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! ctest --test-dir build -C Release --output-on-failure; then
            echo "### CTest Failure (Windows)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if [ -f build/Testing/Temporary/LastTest.log ]; then
              cat build/Testing/Temporary/LastTest.log >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! ctest --test-dir build --output-on-failure; then
            echo "### CTest Failure (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if [ -f build/Testing/Temporary/LastTest.log ]; then
              cat build/Testing/Temporary/LastTest.log >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Python tests (uv run pytest)
        run: |
          uv sync --python 3.14 --all-groups
          uv run pytest

  sanitizers:
    name: Sanitizers (${{ matrix.name }} on ${{ matrix.os }})
    needs: [standards]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ASan + UBSan
            build_type: Debug
            cmake_flags: -DENABLE_ASAN=ON -DENABLE_UBSAN=ON -DBUILD_BENCHMARKS=OFF
          - os: ubuntu-latest
            name: TSan
            build_type: RelWithDebInfo
            cmake_flags: -DENABLE_TSAN=ON -DBUILD_BENCHMARKS=OFF
          - os: macos-latest
            name: ASan + UBSan
            build_type: Debug
            cmake_flags: -DENABLE_ASAN=ON -DENABLE_UBSAN=ON -DBUILD_BENCHMARKS=OFF
          - os: macos-latest
            name: TSan
            build_type: RelWithDebInfo
            cmake_flags: -DENABLE_TSAN=ON -DBUILD_BENCHMARKS=OFF

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-dev

      - name: Configure (${{ matrix.name }})
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          if ! cmake -B build-san -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.cmake_flags }}; then
            echo "### CMake Configure Failure (${{ matrix.name }} on ${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if [ -f build-san/CMakeFiles/CMakeConfigureLog.yaml ]; then
              tail -n 120 build-san/CMakeFiles/CMakeConfigureLog.yaml >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Build (${{ matrix.name }})
        run: cmake --build build-san --parallel

      - name: Run CTest under ${{ matrix.name }}
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          if ! ctest --test-dir build-san --output-on-failure; then
            echo "### CTest Failure (${{ matrix.name }} on ${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            if [ -f build-san/Testing/Temporary/LastTest.log ]; then
              cat build-san/Testing/Temporary/LastTest.log >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
